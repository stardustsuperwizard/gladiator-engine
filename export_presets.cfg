; Godot export presets for gladiator-engine.
;
; Exactly one preset: a runnable Linux build with the .pck kept separate
; (binary_format/embed_pck=false), so the export produces the executable and
; the .pck the export epic (#217) treats as its artifact.
;
; No export_path is baked in here. .github/scripts/export-godot.sh takes the
; output path as a command-line argument, so this same preset serves both a
; local run and a CI run.
;
; export_filter is "all_resources" -- res://tests/ is not excluded, because
; project.godot autoloads TestBootstrap="*res://tests/test_bootstrap.gd" and
; an export missing an autoload's script cannot boot. Whether shipped builds
; should keep the test bootstrap is a separate, undecided question (see
; #269's Out of Scope) -- do not narrow this filter to "answer" it here.
;
; Names no Godot version. The engine version is whatever the binary that
; runs export-godot.sh resolves to; see that script's header for why.

[preset.0]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
binary_format/embed_pck=false
binary_format/architecture="x86_64"
texture_format/bptc=true
texture_format/s3tc=true
texture_format/etc=false
texture_format/etc2=false
