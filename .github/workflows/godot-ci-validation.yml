name: Godot CI Validation

on:
  # `paths-ignore` is evaluated by GitHub before a runner is allocated, so an
  # ignored PR costs nothing at all -- unlike an `if:` guard or a
  # changed-files action, which both boot a runner just to decide not to work.
  #
  # The list is a deny-list on purpose. An allow-list (`paths: ['**.gd', ...]`)
  # fails unsafe: the day someone adds a new asset directory, validation
  # silently stops covering it. A deny-list fails safe -- an unrecognized new
  # path runs the check, and a false positive costs two minutes of a free
  # runner. That matters here because the Godot surface is scattered across
  # `rules/`, `scripts/`, `scenes/`, `resources/` and `tests/`, while the
  # files that provably cannot break `--import`/`--quit` are the concentrated
  # ones: markdown, Issue templates, agent prompts.
  #
  # The ignores stop short of the validation harness itself
  # (`.github/scripts/validate-godot.sh`, `.github/actions/setup-godot/`, this
  # file): changing how validation runs should still run validation.
  #
  # A PR runs the check if *any* changed file falls outside the list, so a
  # branch touching both `docs/DESIGN.md` and `rules/combat/resolver.gd` is
  # validated. Only pure-prose PRs skip.
  #
  # BEWARE if this ever becomes a required status check: a workflow skipped by
  # a path filter reports no status at all, so PRs would hang forever on
  # "Expected -- Waiting for status to be reported". Unlike a job skipped by
  # `if:`, which reports success. At that point keep the trigger unfiltered
  # and gate the job instead.
  pull_request:
    paths-ignore:
      # `**.md`, not `**/*.md` -- the latter is ambiguous about matching
      # root-level files like AGENTS.md.
      - '**.md'
      - 'LICENSE'
      - 'docs/**'
      # Agent control plane. Prompts, templates and the dashboard renderer
      # cannot affect whether the engine boots.
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/agents/**'
      - '.github/instructions/**'
      - '.github/workflows/agent-*.yml'
      - '.github/workflows/gdscript-lint.yml'
      - '.github/workflows/issue-linking.yml'
      - '.github/workflows/issue-dependencies.yml'
      - '.github/scripts/render-dashboard.py'
      - '.github/scripts/classify-copilot-outcome.py'
      - '.github/scripts/classify-claude-outcome.py'
      # Issue bookkeeping. These read Issue bodies and call `gh`; they have
      # their own check in `test-issue-dependencies.sh`, which needs no Godot.
      - '.github/scripts/issue_dependencies.py'
      - '.github/scripts/sync-issue-dependencies.py'
      - '.github/scripts/test-issue-dependencies.sh'
      # Label bootstrap. Creates the labels every trigger is keyed on; it calls
      # `gh` and never touches the Godot project. Listed individually like the
      # rest -- this block names scripts rather than the directory, because
      # `.github/scripts/validate-godot.sh` lives there too and a change to how
      # validation runs must still run validation.
      - '.github/scripts/bootstrap-labels.sh'
      # The agent workflows' own composite actions -- prompt-building and
      # CLI plumbing, none of it touches the Godot project.
      # `setup-godot/` is deliberately NOT here: it controls how the engine
      # gets installed for this very check, so a change to it should still
      # run validation.
      - '.github/actions/build-review-request/**'
      - '.github/actions/build-fix-request/**'
      - '.github/actions/run-agent-session/**'
      - '.github/actions/extract-review-verdict/**'
      - '.github/actions/lint-gdscript/**'
      # Task-scope helper for the planner. Control plane, like the entries
      # above.
      - '.github/scripts/task_scope.py'
      # Dependency preparation for Copilot agent sessions. It provisions an
      # agent's environment; it does not change the project.
      - '.github/workflows/copilot-setup-steps.yml'

      # Claude Code control plane -- the counterpart of `.github/agents/**`
      # for the other toolchain: subagent definitions, slash commands, and
      # shared project settings. Ignored as a directory rather than left to
      # `**.md`, because that only ever covered it by accident: everything
      # under `.claude/` happened to be markdown until `settings.json`
      # landed, and the day it did, a pure-infrastructure pull request booted
      # a Godot runner.
      - '.claude/**'

      # Repository plumbing. `.gitignore` decides what git tracks, not what
      # Godot loads.
      - '.gitignore'

      # gdlint configuration, read by `gdscript-lint.yml` and
      # `.github/actions/lint-gdscript/` and never by `validate-godot.sh`.
      # Style is a separate gate from whether the project imports and boots.
      # It is listed in that workflow's `paths` so it still runs the check it
      # actually governs.
      - '.gdlintrc'

  # The escape hatch: run validation by hand against any branch, whatever the
  # filter above decided.
  workflow_dispatch:

# The job body lives in `godot-validation.yml` so the agent workflows can run
# the identical job against the commits they push, instead of depending on
# this file's `pull_request` trigger firing for them -- which in the source
# repo repeatedly failed to do, landing in `action_required` and never
# executing.
#
# No `head-sha` is passed. A `pull_request` run already attaches its status to
# the right commit, so an explicit check run here would only duplicate what
# GitHub reports for free -- and `checks: write` stays unneeded.
jobs:
  godot-headless-validation:
    uses: ./.github/workflows/godot-validation.yml
    permissions:
      contents: read
