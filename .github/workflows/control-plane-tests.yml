name: Control Plane Tests

# The check that runs the control plane's own tests.
#
# Until this existed, nothing did. `.github/scripts/test-issue-dependencies.sh`
# was written as a regression check, committed, and then never invoked by any
# workflow -- godot-ci-validation.yml even lists it under `paths-ignore` with a
# comment saying those scripts "have their own check in
# test-issue-dependencies.sh", which was true of the file and false of CI. A
# test nothing runs is a test that passes forever.
#
# So this job runs both harnesses, and the linter #99 asked for:
#
#   test-workflow-logic.sh       logic embedded in workflow YAML -- the
#                                `shell: python` steps and `--jq` programs
#                                that no other test can reach (#68).
#                                It also checks (Part 6) that the four agent
#                                roles stay paired across `.github/agents/`,
#                                `.claude/agents/` and `.claude/commands/`.
#   test-issue-dependencies.sh   the two `.github/scripts/` modules that read
#                                Issue bodies and drive `gh`.
#   actionlint                   workflow schema, expression syntax, and
#                                action-reference checking.
#
# Neither script needs network, credentials, the GitHub CLI, or a real
# repository, so this job stays fast and cannot flake on a rate limit.

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/scripts/**'
      - '.github/agents/**'
      - '.claude/agents/**'
      - '.claude/commands/**'
      - 'project.godot'
      - 'docs/engine-reference/godot/VERSION.md'

  # Deliberately also on push to the default branch. The `paths` filter above
  # means a pull request that changes nothing under the control plane never
  # runs this -- correct -- but it also means a merge queue or a direct push
  # could land a control-plane change that no pull request check ever saw.
  #
  # `.github/agents/`, `.claude/agents/` and `.claude/commands/` are in the
  # filter because Part 6 reads all three. A role definition edited on one
  # surface alone is exactly the change that breaks parity, so it is exactly
  # the change that must trigger the check.
  #
  # `project.godot` and the engine reference's `VERSION.md` are there for the
  # same reason on Part 7's behalf: a Godot bump that touches only the engine
  # version declaration, or only the document recording it, is the half-done
  # bump that part exists to catch.
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/scripts/**'
      - '.github/agents/**'
      - '.claude/agents/**'
      - '.claude/commands/**'
      - 'project.godot'
      - 'docs/engine-reference/godot/VERSION.md'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-plane-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  harnesses:
    name: Control Plane Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Both harnesses state that python3 is all they need. ubuntu-latest
      # ships it, along with the jq that test-workflow-logic.sh uses when it
      # is present -- so there is deliberately no setup step here. A control
      # plane test that needed provisioning would be one more thing that can
      # fail for a reason unrelated to the code it checks.
      - name: Workflow-Embedded Logic
        shell: bash
        run: .github/scripts/test-workflow-logic.sh

      # `if: always()` so one red harness does not hide the other's result.
      # Two failures reported at once is one debugging round, not two.
      - name: Issue Dependency Contract
        if: always()
        shell: bash
        run: .github/scripts/test-issue-dependencies.sh

      # Pinned by version AND checksum. This is the one thing in the job that
      # comes from off the runner, and an unpinned linter is a supply-chain
      # hole that runs on every control-plane change.
      - name: Install actionlint
        if: always()
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.7"
          ACTIONLINT_SHA256: >-
            023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          set -euo pipefail

          TARBALL="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"

          curl -sSLf \
            -o "$RUNNER_TEMP/$TARBALL" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${TARBALL}"

          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$TARBALL" | sha256sum -c -

          tar -xzf "$RUNNER_TEMP/$TARBALL" -C "$RUNNER_TEMP" actionlint

      - name: Actionlint
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          # shellcheck and pyflakes integration are OFF, deliberately.
          #
          # actionlint shells out to both when they are on PATH, and they are
          # on ubuntu-latest. Pointed at this repository that means linting
          # every embedded bash and python block as though it were a
          # standalone program -- thousands of lines of it, most of the
          # findings style rather than defects, and none of it what #99 asked
          # for. The embedded programs have their own check:
          # test-workflow-logic.sh Part 1 compiles every python step and
          # parses every jq program. This step checks the workflow schema.
          #
          # The ignore is a false positive, not a silenced defect.
          # `copilot-requests` is a real permission scope -- five agent
          # workflows need it to open a Copilot session -- and actionlint
          # 1.7.7 simply predates it. Drop this when a release knows the
          # scope; leaving it in only re-hides a genuinely unknown scope.
          "$RUNNER_TEMP/actionlint" \
            -no-color \
            -oneline \
            -shellcheck= \
            -pyflakes= \
            -ignore 'unknown permission scope "copilot-requests"'
