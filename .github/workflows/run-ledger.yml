name: Run Ledger

# The only writer of `.metrics/runs.csv`, which lives on the `ledger` branch
# and not on `main`.
#
# One merge to `main` becomes one commit on the `ledger` branch appending one
# `event=merge` row for the merged pull request plus one `event=session` row
# per session-record comment on it. Nothing else in the control plane appends
# to that file, and nothing here reads a model's prose: every field is derived
# by `.github/scripts/ledger_row.py` from GitHub's own JSON. See
# `docs/RUN_LEDGER.md` for the schema, the vocabularies, and why the branch.
#
# This workflow writes nothing to `main`. It is triggered by a push to `main`
# and it checks `main` out to run the row builder, but every write goes to a
# separate checkout of the `ledger` branch under $RUNNER_TEMP -- see
# `Materialize the Ledger Branch` for the ruleset that makes that necessary.
#
# Three properties this workflow is built around, in the order they matter:
#
#   1. It never fails anything else. A merge has already happened by the time
#      this runs; a lost row is a gap in a ledger, a red run is a signal that
#      something is wrong with the merge. So every step that can fail is
#      guarded, says what failed with `::warning::`, and leaves the job green.
#      `continue-on-error` is deliberately not used: it would hide the reason
#      as well as the failure.
#   2. It never cancels. `cancel-in-progress: false` on a single `ledger`
#      group serialises every run, because a cancelled write is a lost row and
#      two concurrent writes race on the same file.
#   3. It appends only. Existing lines are never rewritten, sorted, reordered
#      or deleted, and the header is never touched. Re-running against a SHA
#      whose rows are already present is a no-op, byte for byte.
#
# Spends no AI credits. `GITHUB_TOKEN` only -- no PAT, no deploy key, no app
# credential. That is what #219 requires, and it is also why the ledger branch
# needs no ruleset exemption: a deploy key could be given one, but a deploy-key
# push raises workflow events, and `ci.yml` has no `paths-ignore` on push to
# `main`, so every ledger commit would trigger a full nine-job build.

on:
  # `push` on `main`, not `pull_request`: a pull request event can run from a
  # feature branch's own context, and this workflow reads `main`'s merges.
  #
  # `branches: [main]` already excludes the `ledger` branch, so a ledger commit
  # cannot trigger this workflow however it was pushed. `paths-ignore` is kept
  # as a second latch for the same loop: it costs nothing, and it stays correct
  # if the ledger ever lands on a branch this trigger does watch.
  push:
    branches:
      - main
    paths-ignore:
      - '.metrics/**'

  # Manual replay for a merge whose ledger run failed or was never triggered.
  # `type: string`, never `type: number` -- a number input reaches the shell
  # as a float (see test-workflow-logic.sh Part 9).
  workflow_dispatch:
    inputs:
      sha:
        description: >-
          Commit SHA on main to replay. Defaults to the current head of main.
        required: false
        type: string

permissions:
  contents: write
  pull-requests: read
  issues: read

concurrency:
  # Never cancel an in-flight ledger write: a cancelled write is a lost row,
  # and the next run has no way to know a row went missing. Runs queue.
  group: ledger
  cancel-in-progress: false

jobs:
  ledger:
    name: Run Ledger
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}

      # The ledger's path *within the ledger branch's own checkout*, which
      # lives under $RUNNER_TEMP. This workflow writes nothing in the `main`
      # checkout at all any more -- see `Materialize the Ledger Branch` for
      # why the ledger moved off `main`. Everything else it produces --
      # fetched JSON, computed rows, diagnostics -- also goes under
      # $RUNNER_TEMP (test-workflow-logic.sh Part 5).
      LEDGER: .metrics/runs.csv

      # The branch the ledger lives on. Deliberately not `main`: the
      # `Main Protection` ruleset requires a pull request there and a
      # `GITHUB_TOKEN` push cannot be exempted from it. See #369.
      LEDGER_BRANCH: ledger

      # Written when the branch is created, and never again. Kept here rather
      # than in the branch-creation step so that the one place naming the
      # schema is the same place `ledger_row.py` is pointed at; a column added
      # there without a change here is caught by test-workflow-logic.sh.
      LEDGER_HEADER: timestamp,event,issue,pr,role,vendor,model_requested,model_resolved,tier_label,fix_round,verdict,outcome,duration_seconds,run_url

      # The merge row's `run_url`. A session row carries its own, out of the
      # session record; this is the run that appended it.
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      # Shallow is enough. This checkout exists only to run
      # `.github/scripts/ledger_row.py`; nothing here reads `main`'s history,
      # and nothing here writes to it. The rebase that used to need full
      # history now happens in the ledger branch's own checkout, which fetches
      # what it needs itself.
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      # Which pull request did this commit arrive by? Answered by GitHub's
      # associated-pull-requests endpoint rather than by reading the commit
      # message, so a hand-written or reworded merge commit is still resolved.
      #
      # A direct push to `main` has no associated merged pull request. That is
      # a normal thing to happen, not a failure: it is logged and the ledger
      # is left alone.
      #
      # The endpoint can name more than one pull request for a commit -- a
      # branch merged into another branch that was then merged here. Only
      # merged ones count, and the first of those is the one this commit
      # arrived by; a replay is how a second one would be recorded.
      - name: Resolve the Merged Pull Request
        id: pr
        shell: bash
        env:
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          set -uo pipefail

          if ! gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" \
              --jq 'map(select(.merged_at != null)) | .[0].number // empty' \
              > "$RUNNER_TEMP"/pr-number.txt 2> "$RUNNER_TEMP"/pr-lookup.err; then
            echo "::warning::Could not look up the pull request for $SHA:" \
                 "$(tr '\n' ' ' < "$RUNNER_TEMP"/pr-lookup.err)." \
                 "The ledger is unchanged."
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NUMBER="$(tr -d '[:space:]' < "$RUNNER_TEMP"/pr-number.txt)"

          if [ -z "$NUMBER" ]; then
            echo "No merged pull request is associated with $SHA." \
                 "Nothing to record; the ledger is unchanged."
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Commit $SHA arrived by pull request #$NUMBER."
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Fetch the Pull Request JSON
        id: fetch
        if: steps.pr.outputs.number != ''
        shell: bash
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -uo pipefail

          if ! gh pr view "$PR" \
              --repo "$GITHUB_REPOSITORY" \
              --json number,mergedAt,body,labels,comments,closingIssuesReferences \
              > "$RUNNER_TEMP"/pr.json 2> "$RUNNER_TEMP"/pr-fetch.err; then
            echo "::warning::Could not fetch pull request #$PR:" \
                 "$(tr '\n' ' ' < "$RUNNER_TEMP"/pr-fetch.err)." \
                 "The ledger is unchanged."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          wc -c "$RUNNER_TEMP"/pr.json
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # The closed Issue supplies exactly one column, `tier_label`, and only
      # the builder knows which Issue that is: it prefers the pull request's
      # `closingIssuesReferences` and falls back to the `Closes #N` line.
      # Rather than re-derive that rule here -- a second copy is one that
      # stops matching the first -- the builder is run once without an Issue
      # to *ask* it which Issue the rows belong to, and its answer is what
      # gets fetched. Field 3 of the first row is `issue`; the two fields
      # before it are a timestamp and the literal `merge`, neither of which
      # can contain a comma or a quote.
      #
      # Every failure here costs one column and nothing else, so each one
      # warns and carries on with no Issue JSON at all.
      - name: Fetch the Closed Issue JSON
        id: issue
        if: steps.fetch.outputs.ok == 'true'
        shell: bash
        run: |
          set -uo pipefail

          if ! .github/scripts/ledger_row.py \
              --pr-json "$RUNNER_TEMP"/pr.json \
              --run-url "$RUN_URL" \
              > "$RUNNER_TEMP"/probe.csv 2> "$RUNNER_TEMP"/probe.err; then
            echo "::warning::Could not read the Issue number off the rows" \
                 "for the merged pull request:" \
                 "$(tr '\n' ' ' < "$RUNNER_TEMP"/probe.err)." \
                 "tier_label will be empty."
            exit 0
          fi

          NUMBER="$(head -n 1 "$RUNNER_TEMP"/probe.csv | cut -d, -f3)"

          if [ -z "$NUMBER" ]; then
            echo "This pull request closes no Issue; tier_label will be empty."
            exit 0
          fi

          if ! gh issue view "$NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --json number,labels \
              > "$RUNNER_TEMP"/issue.json 2> "$RUNNER_TEMP"/issue-fetch.err; then
            echo "::warning::Could not fetch Issue #$NUMBER:" \
                 "$(tr '\n' ' ' < "$RUNNER_TEMP"/issue-fetch.err)." \
                 "tier_label will be empty."
            rm -f "$RUNNER_TEMP"/issue.json
            exit 0
          fi

          echo "Read the model tier from Issue #$NUMBER."

      # Every field in every row is decided here, by the builder, from the
      # JSON fetched above. This workflow computes no field of its own.
      - name: Build the Rows
        id: build
        if: steps.fetch.outputs.ok == 'true'
        shell: bash
        run: |
          set -uo pipefail

          ARGS=(--pr-json "$RUNNER_TEMP"/pr.json --run-url "$RUN_URL")

          if [ -f "$RUNNER_TEMP"/issue.json ]; then
            ARGS+=(--issue-json "$RUNNER_TEMP"/issue.json)
          fi

          if ! .github/scripts/ledger_row.py "${ARGS[@]}" \
              > "$RUNNER_TEMP"/rows.csv 2> "$RUNNER_TEMP"/build.err; then
            echo "::warning::ledger_row.py failed to build the rows for this" \
                 "merge: $(tr '\n' ' ' < "$RUNNER_TEMP"/build.err)." \
                 "The ledger is unchanged."
            rm -f "$RUNNER_TEMP"/rows.csv
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cat "$RUNNER_TEMP"/build.err
          cat "$RUNNER_TEMP"/rows.csv
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # Deduplicate, then append verbatim.
      #
      # A row is already recorded when its (`event`, `pr`) pair appears in the
      # file *as it stood before this run*. That makes a replay of an
      # already-recorded merge a no-op while still letting one merge append
      # several `event=session` rows for the same pull request in one go --
      # which a pair-wise check against the batch itself would collapse to
      # one.
      #
      # The surviving lines are appended byte for byte as the builder printed
      # them. Re-encoding them through a writer here would be a second
      # opinion on quoting, and the file would disagree with itself.

      # The ledger lives on its own branch, and this is where that branch
      # becomes a working tree under $RUNNER_TEMP.
      #
      # WHY NOT `main`. The `Main Protection` ruleset requires a pull request
      # on `~DEFAULT_BRANCH`, so a direct push is rejected. A `GITHUB_TOKEN`
      # push cannot be exempted from it either: adding a bypass actor for the
      # GitHub Actions integration is refused with
      #
      #   422  Actor GitHub Actions integration must be part of the ruleset
      #        source or owner organization
      #
      # and this repository is user-owned, so there is no owner organization
      # for it to belong to. The ruleset's conditions name `~DEFAULT_BRANCH`
      # and nothing else, so any other branch is unrestricted and needs no
      # exemption at all. See #369.
      #
      # WHY AN ORPHAN. The branch shares no history with `main` and is never
      # merged in either direction. Merging it back would put the ledger on
      # the protected branch again, which is the thing being undone; keeping
      # it disjoint also means a ledger commit can never carry a code change
      # and a code change can never carry a ledger commit.
      #
      # WHY HERE AND NOT IN ITS OWN WORKFLOW. This job's `concurrency: ledger`
      # group with `cancel-in-progress: false` serialises every ledger run.
      # A "create the branch" workflow would sit outside that group, so it
      # could race an append. As a step it is inside the same lock, and the
      # branch name is named once.
      #
      # WHAT RECREATION DOES AND DOES NOT DO. If the branch is missing this
      # restores the header and nothing else -- the rows are gone. That is a
      # guard against a hard failure and a first-run bootstrap, not a backup.
      # Deletion is what a ruleset on this branch is for.
      - name: Materialize the Ledger Branch
        id: branch
        if: steps.build.outputs.ok == 'true'
        shell: bash
        env:
          LEDGER_DIR: ${{ runner.temp }}/ledger
        run: |
          set -uo pipefail

          give_up() {
            echo "::warning::$1 The ledger is unchanged."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          rm -rf "$LEDGER_DIR"
          mkdir -p "$LEDGER_DIR"
          cd "$LEDGER_DIR" || give_up "Cannot enter $LEDGER_DIR."

          git init -q || give_up "Cannot initialise $LEDGER_DIR."
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Authenticate the way actions/checkout does, so the token is in a
          # header rather than baked into a remote URL that shows up in every
          # error message this step could print.
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git config http.extraheader "AUTHORIZATION: basic $AUTH"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"

          # Not shallow. The retry path in `Commit and Push` rebases, and a
          # depth-1 fetch has nothing to rebase onto -- the same reason the
          # `main` checkout used to ask for full history. The ledger branch
          # holds one small CSV, so there is nothing to save by truncating it.
          if git fetch -q origin "$LEDGER_BRANCH" 2> "$RUNNER_TEMP"/fetch.err; then
            git checkout -q -B "$LEDGER_BRANCH" FETCH_HEAD \
              || give_up "Cannot check out '$LEDGER_BRANCH'."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Branch '$LEDGER_BRANCH' does not exist" \
                 "($(tr '\n' ' ' < "$RUNNER_TEMP"/fetch.err))." \
                 "Creating it with a header and no rows. If it existed" \
                 "before, its rows are not recovered by this."
            # `git init` leaves HEAD on an unborn branch, so -b here gives a
            # branch whose first commit is a root commit: an orphan, with no
            # --orphan needed and no history from `main` to discard.
            git checkout -q -b "$LEDGER_BRANCH" \
              || give_up "Cannot create '$LEDGER_BRANCH'."
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

          mkdir -p "$(dirname "$LEDGER")" || give_up "Cannot create the ledger directory."

          if [ ! -f "$LEDGER" ]; then
            printf '%s\n' "$LEDGER_HEADER" > "$LEDGER" \
              || give_up "Cannot write the ledger header."
            echo "Seeded $LEDGER with its header row."
          fi

          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Append to the Ledger
        id: append
        if: steps.build.outputs.ok == 'true' && steps.branch.outputs.ok == 'true'
        shell: python
        env:
          LEDGER_DIR: ${{ runner.temp }}/ledger
        run: |
          import csv
          import os
          import pathlib

          # Scratch lives in $RUNNER_TEMP, never the working tree.
          SCRATCH = pathlib.Path(os.environ["RUNNER_TEMP"])

          # `LEDGER` is relative to the ledger branch's checkout, not to the
          # `main` checkout this step is running in. Resolving it against
          # $LEDGER_DIR is what keeps this workflow from writing to `main`.
          LEDGER = pathlib.Path(os.environ["LEDGER_DIR"]) / os.environ["LEDGER"]

          EVENT = 1
          PR = 3


          def output(key, value):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write(f"{key}={value}\n")


          def give_up(message):
              print(f"::warning::{message} The ledger is unchanged.")
              output("appended", "0")
              raise SystemExit(0)


          try:
              lines = (SCRATCH / "rows.csv").read_text(
                  encoding="utf-8"
              ).splitlines()
              fresh_rows = list(csv.reader(lines))
          except (OSError, ValueError, csv.Error) as exc:
              give_up(f"Cannot read the computed rows: {exc}.")

          try:
              before = LEDGER.read_text(encoding="utf-8")
              recorded = list(csv.reader(before.splitlines()))
          except (OSError, ValueError, csv.Error) as exc:
              give_up(f"Cannot read {LEDGER}: {exc}.")

          # The header is skipped by position, not by matching its text: a
          # header that has gained a column is still the header, and reading
          # it as a row would put `event` and `pr` in the seen set.
          seen = {
              (row[EVENT], row[PR])
              for row in recorded[1:]
              if len(row) > PR
          }

          keep = []
          for line, row in zip(lines, fresh_rows):
              if len(row) <= PR:
                  print(f"::warning::Skipping a malformed computed row: {line!r}")
                  continue
              if (row[EVENT], row[PR]) in seen:
                  print(
                      f"Already recorded: event={row[EVENT]} pr={row[PR]}."
                      f" Skipping."
                  )
                  continue
              keep.append(line)

          if not keep:
              print("Every computed row is already in the ledger. Nothing to do.")
              output("appended", "0")
              raise SystemExit(0)

          try:
              with LEDGER.open("a", encoding="utf-8", newline="") as fh:
                  # Terminating an unterminated last line is not a rewrite of
                  # it -- no byte already in the file changes -- but it does
                  # mean the file was left in a state this workflow never
                  # produces, so it is worth saying so out loud.
                  if before and not before.endswith("\n"):
                      print(
                          f"::warning::{LEDGER} did not end in a newline;"
                          f" terminating the last line before appending."
                      )
                      fh.write("\n")

                  for line in keep:
                      fh.write(line + "\n")
          except OSError as exc:
              give_up(f"Cannot append to {LEDGER}: {exc}.")

          for line in keep:
              print(f"Appended: {line}")

          output("appended", str(len(keep)))

      # One commit per merge, whatever it appended, on the ledger branch. The
      # push is retried exactly once, after a rebase, because the only thing
      # that should reject it is another ledger run landing between this one's
      # fetch and its push -- and a rebase of an append onto a newer append is
      # exactly the merge git does well. A second rejection means something
      # else is going on; it warns and stops rather than looping.
      #
      # Every exit path sets `recorded`, because a run that loses rows still
      # leaves this job green on purpose (property 1 in the header) and the
      # Summary step is what makes that visible rather than buried.
      - name: Commit and Push
        id: push
        if: steps.append.outputs.appended != '' && steps.append.outputs.appended != '0'
        shell: bash
        env:
          PR: ${{ steps.pr.outputs.number }}
          APPENDED: ${{ steps.append.outputs.appended }}
          LEDGER_DIR: ${{ runner.temp }}/ledger
        run: |
          set -uo pipefail

          lost() {
            echo "::warning::$1"
            echo "recorded=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # Identity and credentials were set on this repository when it was
          # materialised; this step only has to get into it.
          cd "$LEDGER_DIR" || lost "Cannot enter $LEDGER_DIR. Rows for pull request #$PR are not recorded."

          if ! git add -- "$LEDGER"; then
            lost "Could not stage $LEDGER. Rows for pull request #$PR are not recorded."
          fi

          if git diff --cached --quiet -- "$LEDGER"; then
            lost "$APPENDED row(s) were appended but $LEDGER has no staged change. Rows for pull request #$PR are not recorded."
          fi

          if ! git commit -q -m "chore(ledger): record merge of pull request #$PR"; then
            lost "Could not commit the ledger rows for pull request #$PR."
          fi

          if git push -q origin "HEAD:refs/heads/$LEDGER_BRANCH"; then
            echo "Recorded $APPENDED row(s) for pull request #$PR on '$LEDGER_BRANCH'."
            echo "recorded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::warning::Pushing the ledger commit for pull request #$PR was" \
               "rejected. Rebasing onto '$LEDGER_BRANCH' and retrying once."

          if ! git fetch -q origin "$LEDGER_BRANCH"; then
            lost "Could not re-fetch '$LEDGER_BRANCH' to rebase onto. Rows for pull request #$PR are not recorded."
          fi

          if ! git rebase FETCH_HEAD; then
            # A conflict leaves a rebase in progress. The runner is thrown
            # away either way, but an abandoned rebase makes every `git`
            # command after it report on the rebase rather than on the
            # repository, which is a confusing thing to leave in a log.
            git rebase --abort || true
            lost "Could not rebase the ledger commit for pull request #$PR onto '$LEDGER_BRANCH'. Rows are not recorded."
          fi

          if ! git push -q origin "HEAD:refs/heads/$LEDGER_BRANCH"; then
            lost "The ledger commit for pull request #$PR was rejected twice. Rows are not recorded."
          fi

          echo "Recorded $APPENDED row(s) for pull request #$PR after a rebase."
          echo "recorded=true" >> "$GITHUB_OUTPUT"

      # This job stays green even when it loses rows, so the summary is the
      # only place the loss is stated plainly. A run that appended rows but
      # could not push them says so under its own heading, names the pull
      # request, and gives the exact replay that recovers it -- the thing
      # that was missing when a rejected push was one `::warning::` among the
      # log's ordinary chatter.
      - name: Summary
        if: always()
        shell: bash
        env:
          PR: ${{ steps.pr.outputs.number }}
          APPENDED: ${{ steps.append.outputs.appended }}
          SHA: ${{ inputs.sha || github.sha }}
          BRANCH_OK: ${{ steps.branch.outputs.ok }}
          CREATED: ${{ steps.branch.outputs.created }}
          RECORDED: ${{ steps.push.outputs.recorded }}
        run: |
          {
            echo "## Run Ledger"
            echo
            if [ -z "$PR" ]; then
              echo "No merged pull request for \`$SHA\`. Nothing recorded."
            elif [ "$BRANCH_OK" = "false" ]; then
              echo "### :rotating_light: Rows not recorded"
              echo
              echo "Branch \`$LEDGER_BRANCH\` could not be prepared, so pull" \
                   "request #$PR's rows were never written. Replay:"
              echo
              echo '```'
              echo "gh workflow run run-ledger.yml -f sha=$SHA"
              echo '```'
            elif [ -n "$APPENDED" ] && [ "$APPENDED" != "0" ] \
                 && [ "$RECORDED" != "true" ]; then
              echo "### :rotating_light: Rows not recorded"
              echo
              echo "Pull request #$PR: $APPENDED row(s) were built but could" \
                   "not be pushed to \`$LEDGER_BRANCH\`. The ledger is" \
                   "missing them. Replay:"
              echo
              echo '```'
              echo "gh workflow run run-ledger.yml -f sha=$SHA"
              echo '```'
            else
              echo "Pull request #$PR: ${APPENDED:-0} row(s) appended to" \
                   "\`$LEDGER\` on branch \`$LEDGER_BRANCH\`."
              if [ "$CREATED" = "true" ]; then
                echo
                echo ":warning: Branch \`$LEDGER_BRANCH\` did not exist and was" \
                     "created with a header only. Any rows it held before are" \
                     "not recovered by this."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
