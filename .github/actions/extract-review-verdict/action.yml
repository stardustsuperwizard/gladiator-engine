name: Extract Review Verdict
description: >-
  Parses a review session's assistant text into a VERDICT line plus
  Markdown report, refusing to publish a verdict whose reasoning was cut
  short. Shared by agent-04-review.yml (reviewing an existing pull
  request) and agent-02-implement.yml (reviewing a diff before one is
  opened) so both apply the exact same completeness rule -- and, in
  `plan` mode, by a plan review of an epic's tasks, so that one too is
  refused publication when its reasoning was cut short.

inputs:
  assistant-text-file:
    description: Path to the joined assistant text (run-agent-session's assistant-text-file output)
    required: true
  outcome-file:
    description: Path to the vendor classifier's verdict (run-agent-session's outcome-file output)
    required: true
  mode:
    description: >-
      Which review vocabulary to parse. "pr" (the default) is the pull
      request review: PASS / FIX / PLANNING FAILURE / DESIGN AMBIGUITY,
      with the six sections 03-reviewer.agent.md asks for. "plan" is the
      plan review of an epic's tasks: PLAN PASS / PLAN FIX / PLAN REJECT,
      with the three sections 07-plan-reviewer.agent.md asks for. The
      truncation and budget-exhaustion gates are identical in both, and
      the two vocabularies do not overlap -- a plan verdict is not
      accepted in "pr" mode and a pull request verdict is not accepted in
      "plan" mode, so a session prompted for one and answering with the
      other fails loudly rather than publishing the wrong label.
    required: false
    default: pr

outputs:
  verdict:
    description: >-
      In "pr" mode one of PASS, FIX, PLANNING FAILURE, DESIGN AMBIGUITY;
      in "plan" mode one of PLAN PASS, PLAN FIX, PLAN REJECT
    value: ${{ steps.extract.outputs.verdict }}
  slug:
    description: Lowercase, hyphenated verdict, e.g. "planning-failure" or "plan-reject" -- matches this repo's review:<slug> label names
    value: ${{ steps.extract.outputs.slug }}
  review-file:
    description: Path to the verdict line plus full Markdown report, ready to embed in a comment or pull request body
    value: ${{ runner.temp }}/review.md
  failure-file:
    description: >-
      Path to a failure summary, written only when no publishable verdict
      could be extracted (truncated session, malformed output, etc).
      Callers should check for its existence before reading it.
    value: ${{ runner.temp }}/review-verdict-failure.json

runs:
  using: composite
  steps:
    # The reviewer's contract puts VERDICT on the first line, which makes a
    # truncated review the dangerous case rather than the obvious one: the
    # verdict survives and the reasoning behind it does not. A review cut
    # off halfway through its acceptance-criteria table still says
    # "VERDICT: PASS" at the top. A session that did not finish does not
    # get to publish a verdict, however well-formed its first line looks.
    - name: Extract Verdict
      id: extract
      shell: python
      env:
        ASSISTANT_TEXT_FILE: ${{ inputs.assistant-text-file }}
        OUTCOME_FILE: ${{ inputs.outcome-file }}
        MODE: ${{ inputs.mode }}
      run: |
        import json
        import os
        import pathlib
        import re
        import sys

        # Scratch lives in $RUNNER_TEMP, never the working tree.
        SCRATCH = pathlib.Path(os.environ["RUNNER_TEMP"])

        # The same reading of a session's outcome every other caller uses --
        # imported rather than re-typed, so "cut off" and "hit its ceiling"
        # cannot come to mean different things in different workflows. The
        # checkout is at the workspace root; see agent-01-planner.yml for the
        # same import.
        sys.path.insert(
            0,
            os.path.join(
                os.environ.get("GITHUB_WORKSPACE", "."), ".github", "scripts"
            ),
        )

        import model_response

        EVIDENCE_CHARS = 1500

        # One gate, two review vocabularies. The shapes differ -- a plan
        # review reports on a plan, a pull request review on a diff -- but
        # the rule that a verdict must not outlive the reasoning behind it
        # does not, so the two are a table of differences read by identical
        # code rather than two copies of the same gate that can drift.
        #
        # "addenda" are the required sections whose absence from a
        # budget-capped session is NOT evidence the analysis was cut short.
        # In "pr" mode that is "## Deferred Findings" alone: the other five
        # are the review's substance -- a verdict without them is a verdict
        # without the reasoning that earned it, which is the case this gate
        # exists to catch -- while Deferred Findings is an addendum for a
        # later triage pass (agent-06-triage.yml), and a session that wrote
        # every criterion, every constraint and a verdict, then stopped at
        # its credit ceiling without adding it, produced a complete review.
        # Rejecting that as "truncated" would discard a trustworthy verdict
        # and buy a second full review to get the same answer. "plan" mode
        # has no such addendum: all three of its sections are substance.
        PROFILES = {
            "pr": {
                "verdicts": (
                    "PASS",
                    "FIX",
                    "PLANNING FAILURE",
                    "DESIGN AMBIGUITY",
                ),
                "required": (
                    "## Acceptance Criteria",
                    "## Architecture Constraints",
                    "## Scope Adherence",
                    "## Findings",
                    "## Deferred Findings",
                    "## Required Before Merge",
                ),
                "addenda": ("## Deferred Findings",),
            },
            "plan": {
                "verdicts": ("PLAN PASS", "PLAN FIX", "PLAN REJECT"),
                "required": (
                    "## Checks",
                    "## Findings",
                    "## Required Before Dispatch",
                ),
                "addenda": (),
            },
        }

        MODE = (os.environ.get("MODE") or "pr").strip() or "pr"

        if MODE not in PROFILES:
            # A caller's typo, not a session failure, so no
            # review-verdict-failure.json is written: there is no session
            # outcome to classify and nothing for a retry to read.
            print(
                f"::error::Unknown mode {MODE!r}. Expected one of: "
                + ", ".join(sorted(PROFILES))
            )
            sys.exit(1)

        PROFILE = PROFILES[MODE]

        REQUIRED_SECTIONS = list(PROFILE["required"])

        # Which of those, if absent from a budget-capped session, is evidence
        # the analysis itself was cut short rather than merely unwritten.
        TRUNCATION_SECTIONS = [
            heading
            for heading in REQUIRED_SECTIONS
            if heading not in PROFILE["addenda"]
        ]

        outcome_path = pathlib.Path(os.environ["OUTCOME_FILE"])
        outcome = json.loads(outcome_path.read_text()) if outcome_path.exists() else {}

        text_path = pathlib.Path(os.environ["ASSISTANT_TEXT_FILE"])
        text = text_path.read_text(errors="replace").strip() if text_path.exists() else ""


        def fail(kind, headline, guidance, evidence=""):
            """Record a classified failure and stop the job."""

            (SCRATCH / "review-verdict-failure.json").write_text(
                json.dumps(
                    {
                        "reason": kind,
                        "headline": headline,
                        "guidance": guidance,
                        "evidence": evidence[:EVIDENCE_CHARS],
                        "session_reason": outcome.get("reason"),
                        "assistant_text_chars": outcome.get("assistant_text_chars"),
                        "unfinished_turn": outcome.get("unfinished_turn"),
                        "credit_limit": outcome.get("credit_limit"),
                    },
                    indent=2,
                )
                + "\n"
            )

            print(f"::error::{headline}")
            print(guidance)

            if evidence:
                print("--- session output ---")
                print(evidence[:EVIDENCE_CHARS])

            sys.exit(1)


        cut_off = model_response.was_cut_off(outcome)
        budget_hit = model_response.hit_budget(outcome)

        if not text:
            if cut_off or budget_hit:
                fail(
                    "budget_exhausted",
                    outcome.get("headline", "The session stopped before writing any review"),
                    outcome.get("guidance", ""),
                )

            fail(
                "no_assistant_output",
                "The session returned no assistant message",
                "The session ended without saying anything. Check the event"
                " counts in the run-agent-session job log.",
            )

        text = model_response.strip_code_fence(text)

        missing = [heading for heading in REQUIRED_SECTIONS if heading not in text]
        missing_substance = [
            heading for heading in TRUNCATION_SECTIONS if heading not in text
        ]

        # Anchored at both ends, so "VERDICT: PLAN PASS" does not read as
        # this mode's "PASS" and vice versa: the alternation has to consume
        # the whole line, and `\s*` after the colon matches whitespace only.
        # A session prompted for one review and answering in the other's
        # vocabulary is a prompt-following failure, not a verdict.
        match = re.search(
            r"^\s*VERDICT:\s*("
            + "|".join(re.escape(name) for name in PROFILE["verdicts"])
            + r")\s*$",
            text,
            re.MULTILINE,
        )

        if not match:
            if cut_off or budget_hit:
                fail(
                    "budget_exhausted",
                    "The session stopped mid-review, most likely on its AI"
                    f" credit limit ({outcome.get('credit_limit', '?')} credits)",
                    "The reviewer was cut off before it emitted a VERDICT"
                    " line. Nothing here is a formatting problem -- there"
                    " was simply not enough budget to finish. Raise the"
                    " credit cap, or narrow the diff, then retry. Do not"
                    " change the prompt.",
                    text,
                )

            fail(
                "malformed_verdict",
                "The session emitted no recognisable VERDICT line",
                "The session ran to completion within budget and still did"
                " not open with a VERDICT line, so this is a"
                " prompt-following failure rather than a truncated or"
                f" budget-stopped one. In {MODE} mode the accepted verdicts"
                " are: "
                + ", ".join(PROFILE["verdicts"])
                + ".",
                text,
            )

        verdict = match.group(1)

        # A verdict without the reasoning that earned it must not reach the
        # caller. Publishing a truncated PASS is worse than publishing
        # nothing, because the label it applies looks exactly like a real
        # one.
        if cut_off or (budget_hit and missing_substance):
            fail(
                "truncated_review",
                f"The session returned VERDICT: {verdict} but was cut short"
                " before the review was finished",
                "The verdict line comes first, so it survives a truncation"
                " that removes the analysis behind it"
                + (
                    f" -- {len(missing_substance)} of the"
                    f" {len(TRUNCATION_SECTIONS)} substantive sections are"
                    f" missing ({', '.join(missing_substance)})."
                    if missing_substance
                    else "."
                )
                + " This verdict has NOT been published. Raise the credit"
                " cap, or narrow the diff, then retry.",
                text,
            )

        if missing:
            print(
                "::warning::The review is missing "
                + ", ".join(missing)
                + ". The session ran to completion, so the verdict stands,"
                " but the report is not in the requested shape."
            )

        (SCRATCH / "review.md").write_text(text + "\n")

        slug = verdict.lower().replace(" ", "-")

        with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
            handle.write(f"verdict={verdict}\n")
            handle.write(f"slug={slug}\n")

        print(f"VERDICT: {verdict}")

        if outcome.get("budget_signals"):
            print(
                "::warning::This review is complete, but the session"
                " reached its AI credit limit"
                f" ({outcome.get('credit_limit')} credits) on the way."
            )
