name: Setup Godot
description: Download and install a Godot editor build on the runner

inputs:
  godot-version:
    description: Godot release tag to install
    required: false
    default: 4.7.2-stable
  export-templates:
    description: >-
      Also install the Linux export templates for `godot-version`. Opt-in,
      and off by default: only `ci.yml`'s `export` job needs them, the
      archive is well over a gigabyte, and the four call sites that merely
      run `--import`/`--quit` must not pay for it. A composite action input
      is a string, so this is compared against the literal `'true'` rather
      than left to YAML boolean coercion.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # The engine binary is immutable for a given version tag, so it's a
    # pure cache-hit-or-download case -- no dependency-file hash needed,
    # just the version itself. Every call site pins 4.7.2-stable, so after
    # the first run across the whole repo this should hit every time.
    - name: Restore Cached Godot Binary
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/godot
        key: godot-${{ runner.os }}-${{ inputs.godot-version }}

    - name: Install Godot engine
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GODOT_VERSION: ${{ inputs.godot-version }}
      run: |
        set -euo pipefail

        mkdir -p "$RUNNER_TEMP/godot"
        curl -fsSL \
          -o "$RUNNER_TEMP/godot/godot.zip" \
          "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"

        python - <<'PY'
        import os
        import stat
        import zipfile
        from pathlib import Path

        version = os.environ["GODOT_VERSION"]
        install_dir = Path(os.environ["RUNNER_TEMP"]) / "godot"
        archive = install_dir / "godot.zip"
        executable = install_dir / f"Godot_v{version}_linux.x86_64"
        target = install_dir / "godot"

        with zipfile.ZipFile(archive) as archive_file:
            archive_file.extractall(install_dir)

        executable.chmod(executable.stat().st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)
        executable.rename(target)
        PY

        rm -f "$RUNNER_TEMP/godot/godot.zip"

    # Its own cache step -- own `path`, own `key` -- rather than widening the
    # editor cache above. Five call sites depend on that key's hit rate, and
    # an editor-only entry has to stay valid for the four callers that ask
    # for no templates; widening it would invalidate every one of them and
    # then hand them a gigabyte they never use. Like the editor, the archive
    # is immutable for a given tag, so the tag alone is the whole key.
    - name: Restore Cached Godot Export Templates
      id: cache-templates
      if: inputs.export-templates == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.local/share/godot/export_templates
        key: godot-export-templates-${{ runner.os }}-${{ inputs.godot-version }}

    - name: Install Godot Export Templates
      if: >-
        inputs.export-templates == 'true'
        && steps.cache-templates.outputs.cache-hit != 'true'
      shell: bash
      env:
        GODOT_VERSION: ${{ inputs.godot-version }}
      run: |
        set -euo pipefail

        mkdir -p "$RUNNER_TEMP/godot-export-templates"
        curl -fsSL \
          -o "$RUNNER_TEMP/godot-export-templates/templates.tpz" \
          "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"

        python - <<'PY'
        import os
        import zipfile
        from pathlib import Path

        version = os.environ["GODOT_VERSION"]

        # Godot names the directory with dots where the release tag has a
        # dash: 4.7.2-stable becomes 4.7.2.stable. Derived from the input,
        # never written as a literal -- the pin lives in exactly one place,
        # this action's `godot-version` default (#217).
        install_dir = (
            Path.home()
            / ".local/share/godot/export_templates"
            / version.replace("-", ".")
        )
        archive = (
            Path(os.environ["RUNNER_TEMP"])
            / "godot-export-templates"
            / "templates.tpz"
        )

        install_dir.mkdir(parents=True, exist_ok=True)

        # The .tpz is a zip whose members all sit under a single top-level
        # `templates/` directory, and those files belong DIRECTLY in the
        # version directory -- a nested `templates/` does not fail here, it
        # surfaces much later as "No export template found" from a job that
        # looked like it installed fine. So the prefix is stripped, and a
        # member that does not carry it fails loudly rather than being
        # dropped in silence.
        prefix = "templates/"

        with zipfile.ZipFile(archive) as archive_file:
            members = [m for m in archive_file.infolist() if not m.is_dir()]

            stray = [m.filename for m in members if not m.filename.startswith(prefix)]
            if stray:
                raise SystemExit(
                    "export template archive has members outside"
                    f" {prefix!r}: {stray[:5]}"
                )
            if not members:
                raise SystemExit("export template archive contains no files")

            for member in members:
                target = install_dir / member.filename[len(prefix):]
                target.parent.mkdir(parents=True, exist_ok=True)
                with archive_file.open(member) as source:
                    target.write_bytes(source.read())
                mode = (member.external_attr >> 16) & 0o777
                if mode:
                    target.chmod(mode)

        print(f"Installed {len(members)} export template files to {install_dir}")
        PY

        rm -f "$RUNNER_TEMP/godot-export-templates/templates.tpz"

    - name: Add Godot To PATH
      shell: bash
      run: echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
